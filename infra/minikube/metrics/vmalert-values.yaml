server:
  replicaCount: 1
  datasource:
    url: http://vmsingle-victoria-metrics-single-server:8428
  remoteWrite:
    url: http://vmsingle-victoria-metrics-single-server:8428
  configMap: vmalert-rules

alertmanager:
  enabled: true
  config:
    route:
      receiver: devnull
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: devnull
