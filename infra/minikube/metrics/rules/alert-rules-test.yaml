rule_files:
  - alert-rules.yaml

evaluation_interval: 1m

tests:
  - name: catalog outage fires CatalogUnavailable and clears after recovery
    interval: 15s
    input_series:
      - series: 'probe_success{job="bookshop-availability"}'
        values: '1x240 0x40 1x80'
    alert_rule_test:
      - eval_time: 62m
        groupname: bookshop-slo
        alertname: CatalogUnavailable
        exp_alerts: []
      - eval_time: 68m
        groupname: bookshop-slo
        alertname: CatalogUnavailable
        exp_alerts:
          - exp_labels:
              job: bookshop-availability
              severity: critical
              sli: availability
            exp_annotations:
              summary: "Каталог недоступен: доля неуспешных проб превышает 7,2% за час и за последние 5 минут"
      - eval_time: 82m
        groupname: bookshop-slo
        alertname: CatalogUnavailable
        exp_alerts: []

  - name: single failed probe does not fire CatalogUnavailable
    interval: 15s
    input_series:
      - series: 'probe_success{job="bookshop-availability"}'
        values: '1x100 0 1x300'
    alert_rule_test:
      - eval_time: 30m
        groupname: bookshop-slo
        alertname: CatalogUnavailable
        exp_alerts: []

  - name: stopped prober fires CatalogProbeNoData only after five minutes
    interval: 15s
    input_series:
      - series: 'up{job="bookshop-availability"}'
        values: '1x40 0x40 1x40'
      - series: 'probe_success{job="bookshop-availability"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 13m
        groupname: bookshop-slo
        alertname: CatalogProbeNoData
        exp_alerts: []
      - eval_time: 17m
        groupname: bookshop-slo
        alertname: CatalogProbeNoData
        exp_alerts:
          - exp_labels:
              job: bookshop-availability
              severity: warning
              sli: availability
            exp_annotations:
              summary: "Пробер каталога не отдаёт данные: доступность каталога не проверяется"
      - eval_time: 25m
        groupname: bookshop-slo
        alertname: CatalogProbeNoData
        exp_alerts: []

  - name: short prober restart does not fire CatalogProbeNoData
    interval: 15s
    input_series:
      - series: 'up{job="bookshop-availability"}'
        values: '1x40 0x8 1x80'
      - series: 'probe_success{job="bookshop-availability"}'
        values: '1x128'
    alert_rule_test:
      - eval_time: 14m
        groupname: bookshop-slo
        alertname: CatalogProbeNoData
        exp_alerts: []

  - name: missing probe metric fires CatalogProbeNoData
    interval: 15s
    input_series:
      - series: 'up{job="bookshop-pods"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 8m
        groupname: bookshop-slo
        alertname: CatalogProbeNoData
        exp_alerts:
          - exp_labels:
              job: bookshop-availability
              severity: warning
              sli: availability
            exp_annotations:
              summary: "Пробер каталога не отдаёт данные: доступность каталога не проверяется"

  - name: slow reads fire CatalogReadSlow
    interval: 15s
    input_series:
      - series: 'ogen_server_duration_milliseconds_bucket{job="bookshop-pods", oas_operation="listBooks", http_response_status_code="200", le="500"}'
        values: '0+10x240 2400+0x120'
      - series: 'ogen_server_duration_milliseconds_count{job="bookshop-pods", oas_operation="listBooks", http_response_status_code="200"}'
        values: '0+10x360'
    alert_rule_test:
      - eval_time: 65m
        groupname: bookshop-slo
        alertname: CatalogReadSlow
        exp_alerts: []
      - eval_time: 85m
        groupname: bookshop-slo
        alertname: CatalogReadSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              sli: read_latency
            exp_annotations:
              summary: "Чтение каталога медленное: более 30% успешных ответов listBooks медленнее 500 мс за час и за последние 5 минут"

  - name: fast reads do not fire CatalogReadSlow
    interval: 15s
    input_series:
      - series: 'ogen_server_duration_milliseconds_bucket{job="bookshop-pods", oas_operation="listBooks", http_response_status_code="200", le="500"}'
        values: '0+10x360'
      - series: 'ogen_server_duration_milliseconds_count{job="bookshop-pods", oas_operation="listBooks", http_response_status_code="200"}'
        values: '0+10x360'
    alert_rule_test:
      - eval_time: 85m
        groupname: bookshop-slo
        alertname: CatalogReadSlow
        exp_alerts: []

  - name: server errors on writes fire CatalogWriteFailing
    interval: 15s
    input_series:
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="updatePublisher", http_response_status_code="200"}'
        values: '0+10x240 2400+0x120'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="updatePublisher", http_response_status_code="500"}'
        values: '0+0x240 0+10x120'
    alert_rule_test:
      - eval_time: 65m
        groupname: bookshop-slo
        alertname: CatalogWriteFailing
        exp_alerts: []
      - eval_time: 80m
        groupname: bookshop-slo
        alertname: CatalogWriteFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              sli: write_success
            exp_annotations:
              summary: "Запись в каталог падает: доля неуспешных запросов записи превышает 14,4% за час и за последние 5 минут"

  - name: excluded client statuses do not fire CatalogWriteFailing
    interval: 15s
    input_series:
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="updateBook", http_response_status_code="200"}'
        values: '0+10x360'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="updateBook", http_response_status_code="404"}'
        values: '0+10x360'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="updateBook", http_response_status_code="400"}'
        values: '0+10x360'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="createBook", http_response_status_code="200"}'
        values: '0+10x360'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="createBook", http_response_status_code="409"}'
        values: '0+10x360'
    alert_rule_test:
      - eval_time: 85m
        groupname: bookshop-slo
        alertname: CatalogWriteFailing
        exp_alerts: []

  - name: unexpected not found on create fires CatalogWriteFailing
    interval: 15s
    input_series:
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="createBook", http_response_status_code="200"}'
        values: '0+10x240 2400+0x120'
      - series: 'ogen_server_request_count_total{job="bookshop-pods", oas_operation="createBook", http_response_status_code="404"}'
        values: '0+0x240 0+10x120'
    alert_rule_test:
      - eval_time: 80m
        groupname: bookshop-slo
        alertname: CatalogWriteFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              sli: write_success
            exp_annotations:
              summary: "Запись в каталог падает: доля неуспешных запросов записи превышает 14,4% за час и за последние 5 минут"
