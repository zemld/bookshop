apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: bookshop
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: bookshop-migrate:local
          imagePullPolicy: Never
          args: ["up"]
          envFrom:
            - configMapRef:
                name: database
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              value: host=db port=5432 sslmode=disable
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
