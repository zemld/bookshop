apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bookshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: backend
          image: bookshop-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: database
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: password
          readinessProbe:
            httpGet:
              path: /books
              port: http
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
