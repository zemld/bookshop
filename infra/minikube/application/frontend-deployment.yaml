apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bookshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: bookshop-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9091
          env:
            - name: API_URL
              value: http://backend:8080
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
