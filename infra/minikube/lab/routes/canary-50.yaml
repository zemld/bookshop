apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookshop
  namespace: bookshop
spec:
  parentRefs:
    - name: bookshop
      sectionName: http
  rules:
    - backendRefs:
        - name: frontend-blue
          port: 8081
          weight: 50
        - name: frontend-green
          port: 8081
          weight: 50
