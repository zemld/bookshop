apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookshop
  namespace: bookshop
spec:
  parentRefs:
    - name: bookshop
      sectionName: http
  rules:
    - matches:
        - headers:
            - type: Exact
              name: X-Bookshop-Cohort
              value: beta
      backendRefs:
        - name: frontend-green
          port: 8081
    - backendRefs:
        - name: frontend-blue
          port: 8081
