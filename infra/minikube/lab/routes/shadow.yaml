apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookshop
  namespace: bookshop
spec:
  parentRefs:
    - name: bookshop
      sectionName: http
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /books
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: frontend-green
              port: 8081
      backendRefs:
        - name: frontend-blue
          port: 8081
    - backendRefs:
        - name: frontend-blue
          port: 8081
