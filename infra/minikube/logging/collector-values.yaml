fullnameOverride: victoria-logs-collector

remoteWrite:
  - url: http://victoria-logs:9428
    maxDiskUsagePerURL: 512MiB

collector:
  excludeFilter: 'NOT kubernetes.pod_namespace:=bookshop'
  msgField:
    - msg
    - message
    - log
  timeField:
    - time
    - ts
    - timestamp

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
